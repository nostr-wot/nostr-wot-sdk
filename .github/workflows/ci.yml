name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: check:dist must fail on a clean checkout
        # dist/ is gitignored, so a checkout has none. A freshness check that passes here
        # is vacuous, and that is exactly what an earlier attempt shipped. Required red.
        run: |
          if npm run check:dist; then
            echo "check:dist passed with no build present: the guard is vacuous"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: check:dist passes on the build just made
        run: npm run check:dist

      - name: check:dist must fail on a base-config edit
        # Every package extends tsconfig.base.json. A semantic edit to it, no file in any
        # package touched, has to read as a stale dist; then the edit is reverted and the
        # check has to pass again.
        run: |
          node -e "const fs=require('fs');const f='tsconfig.base.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.compilerOptions.removeComments=!j.compilerOptions.removeComments;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          if npm run check:dist; then
            echo "check:dist passed on a stale dist: the base config is not hashed"
            exit 1
          fi
          git checkout -- tsconfig.base.json
          npm run check:dist

      - name: check:dist must fail on a tampered or incomplete dist, in every package that has one
        # The repo-wide check:dist above proves the guard passes on a good build. These prove it
        # actually rejects a bad one, which is what a vendored copy and a published tarball need.
        # Only the bunker was proven this way while it was the only package whose stamp covered
        # its outputs. The list comes from the packages themselves (`dist-stamp.mjs packages`),
        # so a package wired later is covered here without anyone remembering to edit this step.
        run: |
          for pkg in $(node scripts/dist-stamp.mjs packages); do
            name=$(basename "$pkg")
            rm -rf "/tmp/tampered-$name" "/tmp/partial-$name"
            cp -R "$pkg/dist" "/tmp/tampered-$name"
            echo "globalThis.tampered = true;" >> "/tmp/tampered-$name/index.js"
            if node scripts/dist-stamp.mjs check "$pkg" --dist "/tmp/tampered-$name"; then
              echo "check:dist passed a tampered copy of $name"
              exit 1
            fi
            cp -R "$pkg/dist" "/tmp/partial-$name"
            rm "/tmp/partial-$name/index.d.ts"
            if node scripts/dist-stamp.mjs check "$pkg" --dist "/tmp/partial-$name"; then
              echo "check:dist passed a partial copy of $name"
              exit 1
            fi
            echo "$name: the check bites on a tampered dist and on a partial one"
          done

      - name: Every packed tarball carries the dist that was just verified
        # What `npm publish` uploads is whatever `dist/` holds when it runs, so the tarball has
        # to match the build check:dist passed a moment ago.
        run: |
          for pkg in $(node scripts/dist-stamp.mjs packages); do
            name=$(basename "$pkg")
            tarball=$(cd "$pkg" && npm pack --silent | tail -1)
            rm -rf "/tmp/packed-$name" && mkdir -p "/tmp/packed-$name"
            tar -xzf "$pkg/$tarball" -C "/tmp/packed-$name"
            node scripts/dist-stamp.mjs check "$pkg" --dist "/tmp/packed-$name/package/dist"
            rm "$pkg/$tarball"
          done

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true
