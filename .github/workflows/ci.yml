name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check built output matches its inputs and its stamp
        run: npm run check:dist -w @nostr-wot/bunker

      - name: check:dist must fail on a tampered or incomplete copy
        run: |
          cp -R packages/bunker/dist /tmp/tampered && echo "garbage" >> /tmp/tampered/index.js
          if node packages/bunker/scripts/check-dist.mjs --dist /tmp/tampered; then echo "check:dist passed a tampered copy" && exit 1; fi
          cp -R packages/bunker/dist /tmp/partial && rm /tmp/partial/index.cjs /tmp/partial/index.d.ts
          if node packages/bunker/scripts/check-dist.mjs --dist /tmp/partial; then echo "check:dist passed a partial copy" && exit 1; fi

      - name: The packed tarball carries a dist that matches this tree
        run: |
          tarball=$(cd packages/bunker && npm pack --silent | tail -1)
          mkdir -p /tmp/vendored && tar -xzf "packages/bunker/$tarball" -C /tmp/vendored
          node packages/bunker/scripts/check-dist.mjs --dist /tmp/vendored/package/dist

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true
