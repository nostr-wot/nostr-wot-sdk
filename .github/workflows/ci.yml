name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: check:dist must fail on a clean checkout
        # dist/ is gitignored, so a checkout has none. A freshness check that passes here
        # is vacuous, and that is exactly what an earlier attempt shipped. Required red.
        run: |
          if npm run check:dist; then
            echo "check:dist passed with no build present: the guard is vacuous"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: check:dist passes on the build just made
        run: npm run check:dist

      - name: check:dist must fail on a base-config edit
        # Every package extends tsconfig.base.json. A semantic edit to it, no file in any
        # package touched, has to read as a stale dist; then the edit is reverted and the
        # check has to pass again.
        run: |
          node -e "const fs=require('fs');const f='tsconfig.base.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.compilerOptions.removeComments=!j.compilerOptions.removeComments;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          if npm run check:dist; then
            echo "check:dist passed on a stale dist: the base config is not hashed"
            exit 1
          fi
          git checkout -- tsconfig.base.json
          npm run check:dist

      - name: bunker check:dist must fail on a tampered or incomplete copy
        # The repo-wide check:dist above proves the guard passes on a good build. These
        # prove it actually rejects a bad one, which is what a vendored tarball needs.
        run: |
          cp -R packages/bunker/dist /tmp/tampered && echo "garbage" >> /tmp/tampered/index.js
          if node packages/bunker/scripts/check-dist.mjs --dist /tmp/tampered; then echo "check:dist passed a tampered copy" && exit 1; fi
          cp -R packages/bunker/dist /tmp/partial && rm /tmp/partial/index.cjs /tmp/partial/index.d.ts
          if node packages/bunker/scripts/check-dist.mjs --dist /tmp/partial; then echo "check:dist passed a partial copy" && exit 1; fi

      - name: The packed bunker tarball carries a dist that matches this tree
        run: |
          tarball=$(cd packages/bunker && npm pack --silent | tail -1)
          mkdir -p /tmp/vendored && tar -xzf "packages/bunker/$tarball" -C /tmp/vendored
          node packages/bunker/scripts/check-dist.mjs --dist /tmp/vendored/package/dist

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true
