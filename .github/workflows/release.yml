name: Release

on:
  push:
    branches: [main]

# Only one release run at a time so a queued workflow doesn't race the
# version PR open by an earlier run.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write       # changesets writes version commits + tags
  pull-requests: write  # opens / updates the "version packages" PR
  id-token: write       # required for npm provenance attestation

jobs:
  release:
    name: Version PR or Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # changesets needs full history for changelog

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: npm ci

      - name: Build all packages
        run: npm run build

      # Two paths:
      #   - Changesets present → opens / updates a "release" PR with bumped
      #     versions + CHANGELOG entries. Nothing publishes yet.
      #   - No changesets present (e.g. the release PR just merged) →
      #     publishes everything that doesn't yet exist on npm at its
      #     current version.
      - name: Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          commit: "chore: release"
          title: "chore: release"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
