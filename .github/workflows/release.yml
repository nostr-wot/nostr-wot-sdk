name: Release

on:
  push:
    branches: [main]
  # So a release can be retried without pushing an empty commit — useful when a
  # publish fails for a reason outside the repo, such as an npm 2FA setting.
  workflow_dispatch:

# Only one release run at a time, so a queued workflow cannot race an earlier
# one that is midway through versioning and publishing.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write   # version commits + tags pushed straight to main
  id-token: write   # npm provenance attestation

jobs:
  release:
    name: Version and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # changesets needs full history for the changelog

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: npm ci

      - name: Check for changesets
        id: changesets
        run: |
          if compgen -G ".changeset/*.md" > /dev/null && \
             [ "$(ls .changeset/*.md | grep -v README | wc -l)" -gt 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Version directly on main rather than opening a "version packages" PR.
      # changesets/action's PR flow cannot work here: this repo does not allow
      # GitHub Actions to create pull requests, so every release run failed at
      # "GitHub Actions is not permitted to create or approve pull requests".
      - name: Apply versions
        if: steps.changesets.outputs.present == 'true'
        run: |
          npm run version-packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release [skip ci]"
          git push origin HEAD:main
        env:
          # @changesets/changelog-github calls the GitHub API to attribute each
          # entry, and errors out without a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: check:dist must fail on a clean checkout
        # dist/ is gitignored, so a checkout has none. A freshness check that passes here
        # is vacuous, and that is exactly what an earlier attempt shipped. Required red.
        run: |
          if npm run check:dist; then
            echo "check:dist passed with no build present: the guard is vacuous"
            exit 1
          fi

      - name: Build all packages
        run: npm run build

      - name: check:dist passes on the build just made
        run: npm run check:dist

      - name: Verify release
        run: npm run typecheck && npm run test:run

      - name: Every packed tarball carries the dist that was just verified
        # No package rebuilds during pack or publish any more (there is no `prepack`), so the
        # tarball `npm publish` would upload has to hold exactly the bytes check:dist verified
        # above. While `prepack: npm run build` was set, `changeset publish` rebuilt and
        # re-stamped every dist/ during the publish itself, so what landed on npm came from a
        # build no gate had seen.
        run: |
          for pkg in $(node scripts/dist-stamp.mjs packages); do
            name=$(basename "$pkg")
            tarball=$(cd "$pkg" && npm pack --silent | tail -1)
            rm -rf "/tmp/packed-$name" && mkdir -p "/tmp/packed-$name"
            tar -xzf "$pkg/$tarball" -C "/tmp/packed-$name"
            node scripts/dist-stamp.mjs check "$pkg" --dist "/tmp/packed-$name/package/dist"
            rm "$pkg/$tarball"
          done

      # `changeset publish` skips anything already on npm at its current
      # version, so re-running this is safe.
      # Always runs. `changeset publish` skips any version already on npm, so this
      # is idempotent — and gating it on changesets being present would mean a run
      # that consumed them (or a re-run after one did) never publishes at all.
      #
      # `npm run release` is `node scripts/release-preflight.mjs && changeset publish`: it
      # re-reads the dist/ this job built and verified rather than building again, so the
      # bytes published are the bytes checked. It used to be `npm run build && changeset
      # publish`, which rebuilt everything after the gate had passed.
      - name: Publish to npm
        run: npm run release
        env:
          # setup-node writes .npmrc from NODE_AUTH_TOKEN, not NPM_TOKEN.
          # The old workflow only set NPM_TOKEN, so publish was unauthenticated.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
